<!DOCTYPE html>
<!-- 고등 나이스 치트시트의 첫 화면 · 학사일정 4개 시기 중 하나를 고르는 진입 페이지 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고등 나이스 치트시트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ── 토큰 ───────────────────────────────── */
  :root {
    --paper:   #e3e1d8;   /* 교무수첩 표지 종이 */
    --card:    #fbfaf6;
    --ink:     #1f2328;
    --sub:     #6b7078;
    --line:    #c9c6bb;

    /* 시기별 색 · 학사일정의 계절을 따른다 */
    --p1: #3a7a48;   /* 2~3월 · 새 학년 시작 */
    --p2: #1f4a75;   /* 학기 중 · 가장 긴 구간 */
    --p3: #a63a2c;   /* 성적처리 · 마감 */
    --p4: #5b3f78;   /* 학년말·대입 전송 */
  }

  * { box-sizing: border-box; }

  /* 한글 줄바꿈은 띄어쓰기 단위로만 */
  body {
    word-break: keep-all;
    overflow-wrap: normal;
    hyphens: none;
    margin: 0;
    padding: 0 20px 72px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    letter-spacing: -0.2px;
    font-feature-settings: 'tnum';
  }

  .wrap { max-width: 900px; margin: 0 auto; }

  /* ── 머리말 ─────────────────────────────── */
  header { padding: 56px 0 28px; }

  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    margin: 0 0 10px;
  }

  .lead {
    margin: 0;
    max-width: 34em;
    color: var(--sub);
    font-size: 16px;
  }

  .today {
    margin: 18px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 14px;
    color: var(--sub);
  }

  .today strong { color: var(--ink); font-weight: 700; }

  /* ── 전체 검색 ──────────────────────────── */
  #search {
    width: 100%;
    margin-top: 18px;
    padding: 12px 14px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
  }

  #search:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  #search::placeholder { color: #9a978d; }

  .results { margin-top: 20px; }

  .results .count {
    margin: 0 0 10px;
    font-size: 13.5px;
    color: var(--sub);
  }

  .results a {
    display: block;
    padding: 14px 16px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
    text-decoration: none;
    color: var(--ink);
  }

  .results a:hover { background: #fff; border-color: var(--sub); }

  .results .hit-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.45;
    margin: 0 0 5px;
  }

  .results .hit-meta {
    font-size: 13px;
    color: var(--sub);
  }

  .results .often {
    display: inline-block;
    margin-right: 4px;
    font-weight: 700;
    color: #fff;
    background: var(--ink);
    border-radius: 2px;
    padding: 1px 7px;
  }

  .results .none {
    padding: 24px 4px;
    font-size: 15px;
    color: var(--sub);
  }

  /* ── 시기 카드 ──────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 26px;
  }

  .period {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 6px solid var(--tone);
    border-radius: 3px;
    padding: 22px 22px 20px;
    cursor: pointer;
  }

  .period:hover { background: #fff; border-color: var(--tone); }
  .period:focus-visible { outline: 3px solid var(--tone); outline-offset: 3px; }

  .period-name {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.6px;
    margin: 0 0 4px;
  }

  .period-months {
    margin: 0 0 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--tone);
  }

  /* 12개월 띠 · 3월부터 시작하는 학사일정 순서 */
  .strip {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 3px;
    margin-bottom: 16px;
  }

  .strip span {
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #a9a69c;
    background: #efeee8;
    border-radius: 2px;
  }

  .strip span.on {
    background: var(--tone);
    color: #fff;
  }

  .tasks {
    margin: 0;
    padding: 14px 0 0;
    border-top: 1px solid #e6e4dc;
    list-style: none;
    font-size: 13.5px;
    color: var(--sub);
    line-height: 1.5;
  }

  .tasks li { margin-bottom: 5px; }
  .tasks li:last-child { margin-bottom: 0; }

  .tasks b {
    color: var(--ink);
    font-weight: 700;
    margin-right: 5px;
  }

  /* 현재 시기 표시 */
  .now {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 12px;
    font-weight: 700;
    color: var(--tone);
    border: 1px solid var(--tone);
    border-radius: 999px;
    padding: 1px 10px;
  }

  /* ── 상태 줄 ────────────────────────────── */
  .status {
    margin-top: 22px;
    min-height: 24px;
    font-size: 14px;
    color: var(--sub);
  }

  .status strong { color: var(--ink); }

  .tree-link {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }

  .tree-link:hover { border-color: var(--ink); }

  @media (max-width: 680px) {
    header { padding-top: 40px; }
    h1 { font-size: 27px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .strip span { font-size: 10px; height: 24px; }
    .now { position: static; display: inline-block; margin-bottom: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>고등 나이스 치트시트</h1>
    <p class="lead">나이스로 업무를 하다 막혔을 때, 문제가 생긴 시기를 고르면 그 시기에 실제로 올라온 질의응답 사례를 모아서 봅니다.</p>
    <p class="today" id="today"></p>

    <input type="search" id="search" placeholder="시기를 모르겠으면 증상이나 오류 메시지로 바로 찾으십시오" autocomplete="off">
  </header>

  <div class="results" id="results" hidden></div>

  <div class="grid" id="grid">

    <button class="period" style="--tone: var(--p1)" data-key="p1" data-name="학기 준비 및 학기초">
      <p class="period-name">학기 준비 및 학기초</p>
      <p class="period-months">2월 ~ 3월</p>
      <div class="strip" aria-hidden="true">
        <span class="on">3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>1</span><span class="on">2</span>
      </div>
      <ul class="tasks">
        <li><b>학교정보</b> 기준년도와 학기 관리, 교무·수업 학기 설정</li>
        <li><b>업무분장</b> 권한 부여, 임시교원 등록</li>
        <li><b>교육과정</b> 편제 및 시간배당, 과목 개설, 성적·출결 수강생 편성</li>
        <li><b>시간표</b> 기초시간표 작성과 전체시간표 반영, 교사 겹침 오류</li>
        <li><b>학적</b> 진급자와 신입생 학적 반영, 반편성, 전입생 수강 매칭</li>
      </ul>
    </button>

    <button class="period" style="--tone: var(--p2)" data-key="p2" data-name="학기 중">
      <p class="period-name">학기 중</p>
      <p class="period-months">4월 ~ 6월 · 9월 ~ 11월</p>
      <div class="strip" aria-hidden="true">
        <span>3</span><span class="on">4</span><span class="on">5</span><span class="on">6</span><span>7</span><span>8</span><span class="on">9</span><span class="on">10</span><span class="on">11</span><span>12</span><span>1</span><span>2</span>
      </div>
      <ul class="tasks">
        <li><b>출결</b> 과목별·교시별 일일 출결 마감, 월별 출결 통계와 마감</li>
        <li><b>지필평가 준비</b> 지필·수행 선행작업, 문항정보표, 성취기준 등록</li>
        <li><b>분할점수</b> 추정분할점수 라운드 등록과 마감, 타 학과 복사</li>
        <li><b>전출입</b> 학기 중 전출입생 성적·출결 이관, 위탁 학생 관리</li>
      </ul>
    </button>

    <button class="period" style="--tone: var(--p3)" data-key="p3" data-name="학기말 성적처리">
      <p class="period-name">학기말 성적처리</p>
      <p class="period-months">7월 · 12월</p>
      <div class="strip" aria-hidden="true">
        <span>3</span><span>4</span><span>5</span><span>6</span><span class="on">7</span><span>8</span><span>9</span><span>10</span><span>11</span><span class="on">12</span><span>1</span><span>2</span>
      </div>
      <ul class="tasks">
        <li><b>성적 산출</b> 결시생 인정점 부여, 성적 마감과 학기말 성적 산출</li>
        <li><b>최성보</b> 대상자 가져오기, 전출생 예외처리, 출결 확인과 학점 반영 마감</li>
        <li><b>공동교육과정</b> 정규외 과목 출결과 이수 처리, 타교 수강생 성적 반영</li>
      </ul>
    </button>

    <button class="period" style="--tone: var(--p4)" data-key="p4" data-name="학년말 및 대입 전송">
      <p class="period-name">학년말 및 대입 전송</p>
      <p class="period-months">8월 말 · 1월 ~ 2월</p>
      <div class="strip" aria-hidden="true">
        <span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span class="on">8</span><span>9</span><span>10</span><span>11</span><span>12</span><span class="on">1</span><span>2</span>
      </div>
      <ul class="tasks">
        <li><b>학생부 마감</b> 자료 반영, 검증 오류 해결, 세특 바이트 수 초과</li>
        <li><b>대입 전송</b> 대입전형 업무용 마감, 인정오류 예외처리 작성</li>
        <li><b>정정대장</b> 졸업생·재학생 과년도 자료 정정, 중복 학년자료 삭제</li>
        <li><b>진급과 졸업</b> 학업성적관리위원회 처리, 수료·졸업 대장 마감</li>
      </ul>
    </button>

  </div>

  <p class="status">시기를 고르면 그 시기에 올라온 사례 목록으로 이동합니다. <a class="tree-link" href="treemap.html">트리맵차트 보기</a></p>

</div>

<script src="cases.js"></script>
<script>
  // 오늘 날짜로 지금이 어느 시기인지 계산해 카드에 표시한다.
  var MONTH_TO_PERIOD = { 2:'p1', 3:'p1', 4:'p2', 5:'p2', 6:'p2', 9:'p2', 10:'p2', 11:'p2', 7:'p3', 12:'p3', 8:'p4', 1:'p4' };
  var now = new Date();
  var month = now.getMonth() + 1;
  var currentKey = MONTH_TO_PERIOD[month];
  var current = document.querySelector('.period[data-key="' + currentKey + '"]');

  if (current) {
    var badge = document.createElement('span');
    badge.className = 'now';
    badge.textContent = '지금 이 시기';
    current.insertBefore(badge, current.firstChild);
  }

  document.getElementById('today').innerHTML =
    now.getFullYear() + '년 ' + month + '월 ' + now.getDate() + '일 · 지금은 <strong>' +
    (current ? current.dataset.name : '학기 중') + '</strong> 시기입니다.';

  // 네 시기 모두 같은 목록 화면을 쓰고, 어느 시기인지는 주소로 넘긴다.
  document.querySelectorAll('.period').forEach(function (btn) {
    btn.addEventListener('click', function () {
      location.href = 'list.html?p=' + btn.dataset.key;
    });
  });

  // 시기를 모를 때 전체 사례에서 바로 찾는다.
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 사례 한 건의 모든 글을 검색용 한 덩어리로 모은다.
  var INDEX = CASES.map(function (c) {
    var parts = [c.title, c.keywords || '', c.path || ''].concat(c.summary || [], c.notes || [], c.why || []);
    var steps = (c.branches || []).reduce(function (all, b) {
      return all.concat(b.name, b.when || '', b.steps);
    }, (c.steps || []).slice());

    steps.forEach(function (s) {
      if (typeof s === 'string') { parts.push(s); return; }
      parts.push(s.name, s.path || '');
      parts = parts.concat([].concat(s.body));
    });

    return { c: c, text: parts.join(' ').toLowerCase() };
  });

  var search  = document.getElementById('search');
  var results = document.getElementById('results');
  var grid    = document.getElementById('grid');

  search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase();

    if (!q) {
      results.hidden = true;
      grid.hidden = false;
      return;
    }

    var hits = INDEX.filter(function (i) { return i.text.indexOf(q) !== -1; })
      .sort(function (a, b) { return (b.c.asks || 0) - (a.c.asks || 0); });
    grid.hidden = true;
    results.hidden = false;

    if (!hits.length) {
      results.innerHTML = '<p class="none">찾는 사례가 없습니다. 다른 낱말로 검색하시거나, 검색창을 비우고 시기를 골라 목록을 훑어보십시오.</p>';
      return;
    }

    results.innerHTML = '<p class="count">사례 ' + hits.length + '건 · 문의가 많은 순</p>' + hits.map(function (i) {
      var c = i.c;
      var when = c.periods.map(function (p) { return PERIODS[p].name; }).join(', ');
      return '<a href="list.html?p=' + c.periods[0] + '#' + esc(c.id) + '">'
        + '<p class="hit-title">' + esc(c.title) + '</p>'
        + '<p class="hit-meta">'
        + (c.asks >= 40 ? '<span class="often">자주 나오는 문제</span> ' : '')
        + esc(when) + ' · ' + esc(c.areas.join(', '))
        + (c.asks ? ' · 문의 ' + c.asks + '건' : '') + '</p>'
        + '</a>';
    }).join('');
  });
</script>
</body>
</html>
