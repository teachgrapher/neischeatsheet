<!DOCTYPE html>
<!-- 시기별 사례 목록 화면 · list.html?p=p1 형태로 시기를 받아 cases.js에서 골라 그린다 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고등 나이스 치트시트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --paper: #e3e1d8;
    --card:  #fbfaf6;
    --ink:   #1f2328;
    --sub:   #6b7078;
    --line:  #c9c6bb;
    --warn:  #8a5a12;
    --tone:  #3a7a48;   /* 시기가 정해지면 자바스크립트가 바꾼다 */
    --tint:  #eef3ee;
  }

  * { box-sizing: border-box; }

  body {
    word-break: keep-all;
    overflow-wrap: normal;
    hyphens: none;
    margin: 0;
    padding: 0 20px 80px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    letter-spacing: -0.2px;
  }

  .wrap { max-width: 820px; margin: 0 auto; }

  /* ── 머리말 ─────────────────────────────── */
  header {
    padding: 28px 0 22px;
    border-bottom: 1px solid var(--line);
  }

  .back {
    display: inline-block;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--sub);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }

  .back:hover { color: var(--ink); border-color: var(--ink); }

  h1 {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.9px;
    margin: 0 0 4px;
    padding-left: 12px;
    border-left: 6px solid var(--tone);
  }

  .months {
    margin: 0 0 20px;
    padding-left: 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--tone);
  }

  #search {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
  }

  #search:focus { outline: 2px solid var(--tone); outline-offset: 1px; }
  #search::placeholder { color: #9a978d; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }

  .filters button {
    font: inherit;
    font-size: 14px;
    padding: 5px 13px;
    color: var(--sub);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .filters button:hover { color: var(--ink); border-color: var(--sub); }

  .filters button[aria-pressed="true"] {
    color: #fff;
    background: var(--tone);
    border-color: var(--tone);
  }

  .count {
    margin: 18px 0 10px;
    font-size: 13.5px;
    color: var(--sub);
  }

  /* ── 사례 ───────────────────────────────── */
  .case {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
    margin-bottom: 10px;
  }

  .case[open] { border-color: var(--tone); }

  .case > summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 18px;
  }

  .case > summary::-webkit-details-marker { display: none; }
  .case > summary:focus-visible { outline: 3px solid var(--tone); outline-offset: -3px; }

  .case-title {
    font-size: 16.5px;
    font-weight: 700;
    line-height: 1.45;
    margin: 0 0 8px;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--sub);
  }

  .area {
    font-weight: 700;
    color: var(--tone);
    border: 1px solid var(--tone);
    border-radius: 2px;
    padding: 0 7px;
  }

  /* 문의가 많은 사례에만 붙인다 */
  .often {
    font-weight: 700;
    color: #fff;
    background: var(--tone);
    border-radius: 2px;
    padding: 1px 7px;
  }

  /* 메뉴 경로 · 펼치지 않아도 어디로 가는지 보이게 한다 */
  .path {
    background: #edece5;
    border-radius: 2px;
    padding: 1px 8px;
    font-size: 12.5px;
    color: #4a4f56;
  }

  .body {
    padding: 0 18px 20px;
    border-top: 1px solid #e6e4dc;
  }

  h2 {
    font-size: 14px;
    font-weight: 700;
    color: var(--sub);
    margin: 22px 0 8px;
  }

  .summary {
    margin: 18px 0 0;
    padding: 14px 16px;
    background: var(--tint);
    border-left: 4px solid var(--tone);
    list-style: none;
  }

  .summary li {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 8px;
    padding-left: 14px;
    position: relative;
  }

  .summary li:last-child { margin-bottom: 0; }

  .summary li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px;
    width: 5px;
    height: 5px;
    background: var(--tone);
    border-radius: 50%;
  }

  /* 상황에 따라 절차가 갈릴 때 */
  .branch { margin-bottom: 22px; }
  .branch:last-child { margin-bottom: 0; }

  .branch-name {
    font-size: 15.5px;
    font-weight: 700;
    margin: 0 0 2px;
    padding-left: 11px;
    border-left: 4px solid var(--tone);
  }

  .branch-when {
    margin: 0 0 12px;
    padding-left: 15px;
    font-size: 14px;
    color: var(--sub);
  }

  .steps { margin: 0; padding: 0; list-style: none; counter-reset: step; }

  .steps > li {
    position: relative;
    padding: 0 0 18px 38px;
    counter-increment: step;
  }

  .steps > li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 2px;
    width: 25px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--tone);
    border-radius: 50%;
  }

  .steps > li:last-child { padding-bottom: 0; }

  .step-name { font-weight: 700; display: block; margin-bottom: 2px; }
  .step-body { font-size: 15px; margin: 0 0 6px; }
  .step-body:last-child { margin-bottom: 0; }
  .steps .path { display: inline-block; margin: 6px 0 4px; }

  .btn {
    border: 1px solid #b9b6ab;
    border-radius: 2px;
    padding: 0 5px;
    font-size: 13.5px;
    font-weight: 600;
    background: #fff;
  }

  .notes {
    margin: 8px 0 0;
    padding: 14px 16px 14px 32px;
    background: #faf5e9;
    border-left: 4px solid var(--warn);
  }

  .notes li { font-size: 14.5px; line-height: 1.6; margin-bottom: 10px; }
  .notes li:last-child { margin-bottom: 0; }

  /* 서로 참조하는 사례 */
  .related {
    margin-top: 22px;
    padding: 14px 16px;
    background: #f1efe8;
    border-radius: 3px;
  }

  .related h2 { margin: 0 0 8px; }
  .related ul { margin: 0; padding-left: 18px; }

  .related li {
    font-size: 14.5px;
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .related li:last-child { margin-bottom: 0; }

  .related a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }

  .related a:hover { border-color: var(--tone); }

  /* 배경 설명 · 급하지 않은 사람만 읽는다 */
  .why {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
  }

  .why ul { margin: 0; padding-left: 18px; }
  .why li { font-size: 14px; color: var(--sub); margin-bottom: 7px; }
  .why li:last-child { margin-bottom: 0; }

  .empty {
    padding: 34px 4px;
    font-size: 15px;
    color: var(--sub);
  }

  /* 제목 왼쪽, 단추 오른쪽 */
  .head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .head-main { flex: 1; min-width: 0; }

  .actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  /* 펼친 사례에만 단추를 보인다 */
  .case:not([open]) .actions { display: none; }

  .actions button {
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    padding: 5px 11px;
    color: var(--sub);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
  }

  .actions button:hover { color: var(--ink); border-color: var(--sub); }
  .actions button:focus-visible { outline: 2px solid var(--tone); outline-offset: 2px; }

  /* 인쇄할 때만 보이는 머리말 */
  .print-head { display: none; }

  .footnote {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--sub);
  }

  @media (max-width: 680px) {
    h1 { font-size: 23px; }
    .case-title { font-size: 15.5px; }
    .notes { padding-left: 30px; }

    .head { flex-direction: column; gap: 10px; }
    .actions button { flex: 1; }
  }

  /* ── 인쇄 · 펼친 사례 한 건만 한 장에 담는다 ── */
  @media print {
    @page { margin: 11mm 12mm; }

    body {
      background: #fff;
      padding: 0;
      font-size: 9.2pt;
      line-height: 1.4;
      letter-spacing: -0.3px;
    }

    .wrap { max-width: none; }

    header, .count, .empty, .footnote, .actions, .related { display: none !important; }
    .case { display: none !important; }

    .case.printing { display: block !important; border: none; background: #fff; }
    .case.printing > summary { padding: 0 0 6px; }
    .case.printing .body { border-top: 1px solid #999; padding: 6px 0 0; }

    .print-head {
      display: block;
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1.5px solid #000;
      font-size: 8.5pt;
      font-weight: 700;
    }

    .case-title { font-size: 13pt; margin-bottom: 4px; }
    .meta { gap: 5px; font-size: 8pt; }

    h2 { margin: 10px 0 4px; font-size: 9pt; }

    .summary {
      margin: 0;
      padding: 7px 10px;
      background: none;
      border-left: 2.5px solid #000;
    }

    .summary li { font-size: 9.2pt; margin-bottom: 3px; line-height: 1.4; }

    .steps > li { padding: 0 0 8px 26px; }
    .steps > li::before { width: 17px; height: 17px; font-size: 8pt; background: #000; }
    .step-body { font-size: 9.2pt; margin-bottom: 3px; }
    .steps .path { margin: 2px 0; }

    .branch { margin-bottom: 10px; }
    .branch-name { font-size: 10pt; }
    .branch-when { margin-bottom: 6px; }

    .notes {
      margin: 0;
      padding: 7px 10px 7px 22px;
      background: none;
      border-left: 2.5px solid #000;
    }

    .notes li { font-size: 9pt; margin-bottom: 5px; line-height: 1.4; }

    .why { margin-top: 10px; padding-top: 8px; }
    .why li { font-size: 8.8pt; margin-bottom: 3px; }

    .area, .often { color: #000; background: none; border: 1px solid #000; }
    .path { background: none; border: 1px solid #bbb; }
    .btn { border-color: #666; }

    /* 단계나 항목이 페이지 경계에서 잘리지만 않게 한다.
       사례 전체에 걸면 통째로 다음 장으로 밀려 빈 면이 생긴다. */
    .steps > li, .notes li, .summary li { page-break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">

  <p class="print-head" id="print-head"></p>

  <header>
    <a class="back" href="index.html">시기 다시 고르기</a>
    <h1 id="period-name"></h1>
    <p class="months" id="period-months"></p>

    <input type="search" id="search" placeholder="증상이나 오류 메시지를 그대로 붙여넣어도 됩니다" autocomplete="off">
    <div class="filters" id="filters"></div>
  </header>

  <p class="count" id="count"></p>
  <div id="list"></div>
  <p class="empty" id="empty" hidden></p>

  <p class="footnote">문의 건수는 나이스광장 질의응답에 올라온 비슷한 질문의 수입니다. 우리 학교 문의 수가 아닙니다.</p>

</div>

<script src="cases.js"></script>
<script>
  // 주소의 p 값으로 시기를 정한다. 값이 없거나 잘못되면 첫 시기로 보낸다.
  var key = new URLSearchParams(location.search).get('p');
  if (!PERIODS[key]) key = 'p1';
  var period = PERIODS[key];

  document.documentElement.style.setProperty('--tone', period.tone);
  document.documentElement.style.setProperty('--tint', period.tint);
  document.title = period.name + ' · 고등 나이스 치트시트';
  document.getElementById('period-name').textContent = period.name;
  document.getElementById('period-months').textContent = period.months;

  // 이 시기에 걸린 사례만 고른다. 한 사례가 여러 시기에 걸칠 수 있다.
  // 문의가 많은 순으로 놓아, 자주 겪는 문제가 위에 오게 한다.
  var cases = CASES
    .filter(function (c) { return c.periods.indexOf(key) !== -1; })
    .sort(function (a, b) { return (b.asks || 0) - (a.asks || 0); });

  // 연결 사례를 제목으로 보여주기 위한 색인
  var BY_ID = {};
  CASES.forEach(function (c) { BY_ID[c.id] = c; });

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 본문의 {저장} 표기를 나이스 버튼 모양으로 바꾼다.
  function rich(s) {
    return esc(s).replace(/\{([^}]+)\}/g, '<span class="btn">$1</span>');
  }

  function li(items, cls) {
    return items.map(function (t) { return '<li' + (cls ? ' class="' + cls + '"' : '') + '>' + rich(t) + '</li>'; }).join('');
  }

  function stepsHtml(steps) {
    return steps.map(function (s) {
      // body는 문단 하나여도 되고, 나뉘면 배열로 적어도 된다.
      var body = [].concat(s.body).map(function (t) {
        return '<p class="step-body">' + rich(t) + '</p>';
      }).join('');

      return '<li>'
        + '<span class="step-name">' + esc(s.name) + '</span>'
        + (s.path ? '<span class="path">' + esc(s.path) + '</span>' : '')
        + body
        + '</li>';
    }).join('');
  }

  function render(list) {
    return list.map(function (c) {
      // 칩 순서는 AREAS를 따른다.
      var areas = AREAS.filter(function (a) { return c.areas.indexOf(a) !== -1; });

      // 다른 시기에도 뜨는 사례라는 것을 알려준다.
      var others = c.periods
        .filter(function (p) { return p !== key && PERIODS[p]; })
        .map(function (p) { return PERIODS[p].name; });

      // 상황에 따라 절차가 통째로 갈리면 branches로 적는다.
      var procedure = c.branches
        ? c.branches.map(function (b) {
            return '<div class="branch">'
              + '<p class="branch-name">' + esc(b.name) + '</p>'
              + (b.when ? '<p class="branch-when">' + rich(b.when) + '</p>' : '')
              + '<ol class="steps">' + stepsHtml(b.steps) + '</ol>'
              + '</div>';
          }).join('')
        : '<ol class="steps">' + stepsHtml(c.steps) + '</ol>';

      // 서로 참조하는 사례를 아래에 링크로 단다.
      var related = (c.related || [])
        .map(function (id) { return BY_ID[id]; })
        .filter(Boolean)
        .map(function (r) {
          var here = r.periods.indexOf(key) !== -1;
          var href = here ? '#' + r.id : 'list.html?p=' + r.periods[0] + '#' + r.id;
          return '<li><a href="' + href + '">' + esc(r.title) + '</a></li>';
        }).join('');

      return '<details class="case" id="' + esc(c.id) + '" data-areas="' + esc(c.areas.join('|')) + '">'
        + '<summary>'
        +   '<div class="head">'
        +     '<div class="head-main">'
        +       '<p class="case-title">' + esc(c.title) + '</p>'
        +       '<div class="meta">'
        +         (c.asks >= 40 ? '<span class="often">자주 나오는 문제</span>' : '')
        +         areas.map(function (a) { return '<span class="area">' + esc(a) + '</span>'; }).join('')
        +         (c.path ? '<span class="path">' + esc(c.path) + '</span>' : '')
        +         (c.asks ? '<span>문의 ' + c.asks + '건</span>' : '')
        +         (others.length ? '<span>' + esc(others.join(', ')) + '에도 해당</span>' : '')
        +       '</div>'
        +     '</div>'
        +     '<div class="actions">'
        +       '<button type="button" data-act="print">인쇄 · PDF 저장</button>'
        +       '<button type="button" data-act="copy">링크 복사</button>'
        +     '</div>'
        +   '</div>'
        + '</summary>'
        + '<div class="body">'
        +   '<ul class="summary">' + li(c.summary) + '</ul>'
        +   '<h2>해결 절차</h2>' + procedure
        +   (c.notes && c.notes.length ? '<h2>주의 사항</h2><ul class="notes">' + li(c.notes) + '</ul>' : '')
        +   (related ? '<div class="related"><h2>이게 아니라면 이쪽을 보십시오</h2><ul>' + related + '</ul></div>' : '')
        +   (c.why && c.why.length ? '<div class="why"><h2>왜 이렇게 되나요</h2><ul>' + li(c.why) + '</ul></div>' : '')
        + '</div>'
        + '</details>';
    }).join('');
  }

  document.getElementById('list').innerHTML = render(cases);

  // 사례가 하나도 없는 칩은 만들지 않는다.
  var usedAreas = AREAS.filter(function (a) {
    return cases.some(function (c) { return c.areas.indexOf(a) !== -1; });
  });

  document.getElementById('filters').innerHTML = (usedAreas.length ? ['전체'].concat(usedAreas) : [])
    .map(function (a, i) {
      return '<button aria-pressed="' + (i === 0) + '" data-area="' + esc(a) + '">' + esc(a) + '</button>';
    }).join('');

  var nodes  = Array.prototype.slice.call(document.querySelectorAll('.case'));
  var search = document.getElementById('search');
  var count  = document.getElementById('count');
  var empty  = document.getElementById('empty');
  var area   = '전체';

  function apply() {
    var q = search.value.trim().toLowerCase();
    var shown = 0;

    nodes.forEach(function (n, i) {
      var text = (n.textContent + ' ' + (cases[i].keywords || '')).toLowerCase();
      var hit = (area === '전체' || n.dataset.areas.split('|').indexOf(area) !== -1)
             && (q === '' || text.indexOf(q) !== -1);
      n.hidden = !hit;
      if (hit) shown++;
    });

    count.textContent = cases.length ? '사례 ' + shown + '건 · 문의가 많은 순' : '';
    empty.hidden = shown > 0;
    empty.textContent = cases.length
      ? '찾는 사례가 없습니다. 다른 낱말로 검색하시거나 필터를 전체로 바꿔 보십시오.'
      : '이 시기의 사례는 아직 채우지 않았습니다.';
  }

  document.getElementById('filters').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    area = btn.dataset.area;
    this.querySelectorAll('button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b === btn));
    });
    apply();
  });

  search.addEventListener('input', apply);
  apply();

  // 사례 한 건만 인쇄하거나 그 사례로 바로 열리는 주소를 복사한다.
  var printHead = document.getElementById('print-head');

  function caseUrl(id) {
    return new URL('list.html?p=' + key + '#' + id, location.href).href;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    // 파일로 직접 열었을 때는 클립보드 API가 막히므로 옛 방식으로 처리한다.
    return new Promise(function (resolve, reject) {
      var box = document.createElement('textarea');
      box.value = text;
      box.style.position = 'fixed';
      box.style.opacity = '0';
      document.body.appendChild(box);
      box.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(box);
      ok ? resolve() : reject();
    });
  }

  function flash(btn, message) {
    var original = btn.textContent;
    btn.textContent = message;
    setTimeout(function () { btn.textContent = original; }, 1800);
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var btn = e.target.closest('.actions button');
    if (!btn) return;

    // 단추가 summary 안에 있으므로 눌러도 접히지 않게 막는다.
    e.preventDefault();
    e.stopPropagation();

    var box = btn.closest('.case');

    if (btn.dataset.act === 'print') {
      printHead.textContent = '고등 나이스 치트시트 · ' + period.name + ' (' + period.months + ')';
      box.classList.add('printing');
      window.print();
      return;
    }

    copyText(caseUrl(box.id)).then(function () {
      flash(btn, '복사했습니다');
    }, function () {
      flash(btn, '복사하지 못했습니다');
    });
  });

  // 인쇄가 끝나면 화면을 원래대로 되돌린다.
  window.addEventListener('afterprint', function () {
    document.querySelectorAll('.case.printing').forEach(function (n) {
      n.classList.remove('printing');
    });
  });
  function openFromHash() {
    if (!location.hash) return;
    var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!target) return;

    // 필터나 검색에 가려져 있으면 먼저 풀어 준다.
    if (target.hidden) {
      search.value = '';
      area = '전체';
      var first = document.querySelector('#filters button');
      if (first) {
        document.querySelectorAll('#filters button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b === first));
        });
      }
      apply();
    }

    target.open = true;
    target.scrollIntoView();
  }

  openFromHash();
  window.addEventListener('hashchange', openFromHash);
</script>
</body>
</html>
